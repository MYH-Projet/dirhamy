services:
  db:
    image: mongo:7
    container_name: dirhamy-db
    # Single-node replica set is required for Prisma interactive $transaction.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - dirhamy-mongodata:/data/db
    # The healthcheck initiates the replica set once, then reports healthy only
    # when the node has become PRIMARY. Backend waits on `service_healthy`.
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'db:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  backend:
    env_file:
      - ./backend/.env
    build:
      context: ./backend
      args:
        DATABASE_URL: mongodb://db:27017/dirhamy?directConnection=true
    container_name: dirhamy-backend
    restart: always
    environment:
      DATABASE_URL: mongodb://db:27017/dirhamy?directConnection=true
      PORT: "3000"
      JWT_SECRET: anas
      REFRESH_TOKEN_SECRET: anas
      REDIS_PORT: 6379
      REDIS_PASSWORD: anas1122

      REDIS_URL: redis

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app:Z
      - /app/node_modules
    command: >
      sh -c "
        echo 'MongoDB replica set is ready' &&
        npx prisma generate &&
        npx prisma db push &&
        npx prisma db seed &&
        npm run dev
      "

  frontend:
    build:
      context: ./frontend
    container_name: dirhamy-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:Z

  redis:
    image: redis:7.4-alpine
    container_name: dirhamy-cache
    restart: always
    command: redis-server --requirepass anas1122
    ports:
      - "6379:6379"
    volumes:
      - dirhamy-redisdata:/data
volumes:
  dirhamy-mongodata:
  dirhamy-redisdata:
